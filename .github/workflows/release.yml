name: Build Release Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Catchphrase-macOS
            asset: dist/Catchphrase.app
            zip_cmd: cd dist && zip -r ../Catchphrase-macOS.zip Catchphrase.app
            zip_name: Catchphrase-macOS.zip
          - os: windows-latest
            artifact: Catchphrase-Windows
            asset: dist/Catchphrase
            zip_cmd: powershell Compress-Archive -Path dist/Catchphrase -DestinationPath Catchphrase-Windows.zip
            zip_name: Catchphrase-Windows.zip
          - os: ubuntu-latest
            artifact: Catchphrase-Linux
            asset: dist/Catchphrase
            zip_cmd: cd dist && tar czf ../Catchphrase-Linux.tar.gz Catchphrase
            zip_name: Catchphrase-Linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller Catchphrase.spec --noconfirm

      - name: Package artifact
        run: ${{ matrix.zip_cmd }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
